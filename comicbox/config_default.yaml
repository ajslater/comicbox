comicbox:
  general:
    config: null
    recurse: False
    dry_run: False
    loglevel: INFO
    dest_path: .
    delete_keys: []
    delete_orig: False
    metadata: {}
    metadata_cli: null
    metadata_format: null
    # Parallel workers across files (1 = serial). Useful with --online for
    # batch tagging. Online requests are paced by a process-wide rate gate
    # that keeps every worker inside the server's window, so this bounds
    # I/O concurrency rather than request rate.
    jobs: 1
    tagger: null
    theme: gruvbox-dark

  read:
    formats:
      - cli
      - comet
      - metroninfo
      - comicbookinfo
      - comicinfo
      - filename
      - json
      - pdf
      - yaml
    except: []
    # Merge precedence, later wins (null = MetadataSources enum order,
    # with the online sources ranked by online.lookup.sources). Set, it
    # is the whole order and online.lookup.sources does not change it.
    merge_order: null

  write:
    # Format keys, as -w takes them. Without keep, the formats named are
    # written and every other tag file is removed; keep among them, as in
    # [cix, keep] or [keep], keeps the formats a comic already has.
    formats: []
    # How supplied metadata (-m, --import, the write API's patch, the
    # config metadata block) merges into a comic's existing tags.
    # One of: additive, update, replace.
    merge_mode: additive
    stamp: False
    stamp_notes: True
    delete_all_tags: False

  print:
    phases: ""
    validate: False

  convert:
    cbz: False
    rename: False
    extract_pages_from: null
    extract_pages_to: null
    extract_covers: False
    import_paths: []
    export_formats: []
    pdf_pages: ""

  compute:
    pages: False
    page_count: True

  online:
    lookup:
      # Match-resolution aggressiveness. One of: ask, careful, auto, eager.
      match: auto
      # Whether prompts are allowed. One of: ask, never.
      prompts: ask
      # Force a fresh search even if the comic has a stored upstream id,
      # skipping the stored-id refresh and series-cache fast paths.
      rematch: False
      # Ordered source selection, run priority and merge precedence. The
      # first listed source runs first; with first_wins True its match
      # ends the lookup (e.g. [comicvine, metron] tries Comic Vine first
      # and falls back to Metron), and with it False the first listed
      # source wins every tag the sources disagree on. null = every
      # configured source in the built-in order (metron, comicvine,
      # versedb). Overridden by --online.
      sources: null
      # When True (default), stop after the first online source that
      # contributes data. Set False to query every selected source and
      # merge their metadata, the first source in order winning where
      # they disagree (CLI: --all-sources).
      first_wins: True

    auth:
      metron:
        # API token from your metron.cloud account page.
        key: null
        url: null
      comicvine:
        key: null
        url: null
      versedb:
        # Personal access token from versedb.com/my/apps/custom/create.
        # Free tier: 300 requests an hour, 4,000 a day; non-commercial use.
        key: null
        url: null

    cache:
      # Tri-state cache mode: on, off, refresh. A bare on or off, which
      # YAML 1.1 reads as a boolean, means the same.
      mode: "on"
      dir: null
      ttl: 7d

    tuning:
      # Auto-write threshold (0-1) — top match must clear this to auto-write.
      auto_threshold: 0.95
      # Per-comic API effort for fan-out sources (ComicVine): minimal,
      # balanced, thorough. Metron and VerseDB don't fan out, so they
      # ignore this.
      # null = unset, which resolves to balanced and lets a large
      # unattended run auto-engage minimal for ComicVine. Naming a value
      # here (or with --effort / COMICBOX_ONLINE__TUNING__EFFORT) pins
      # it: an explicit `balanced` is honored, not auto-engaged away.
      effort: null
      # Retry budget for transient API failures.
      retry_budget: 5
      # Per-source overrides — keyed by source name (metron, comicvine,
      # versedb).
      # Each entry may override auto_threshold, effort, min_confidence,
      # disambiguation_margin, or solo_threshold. See settings.py for
      # shape. rate_limit.* keys (per_minute, per_day, per_second,
      # per_hour) are accepted but ignored with a warning: mokkari>=4
      # reads Metron's actual per-user limits from response headers, and
      # simyan manages ComicVine's internally.
      per_source: {}

  readinglists:
    # The GitHub repository and ref holding DieselTech's CBL reading lists,
    # which `comicbox rl search catalog` and `fetch catalog:PATH` read.
    catalog_repo: DieselTech/CBL-ReadingLists
    catalog_ref: main
    # How long the catalog index is reused before it is revalidated.
    catalog_ttl: 4h
    # The largest reading list a fetch downloads, in bytes (16 MiB).
    max_download_bytes: 16777216

  # Targets (CLI positional args).
  paths: null
