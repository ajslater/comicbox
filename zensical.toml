[project]
site_name = "Comicbox"
site_url = "https://comicbox.readthedocs.io/"
site_author = "AJ"
site_description = "Comicbox Comic Metadata Reader & Writer"
nav = [
  "NEWS.md",
  "SCHEMAS.md",
  "TAGS.md",
  { "JSON Schemas" = [
    "schema/comicbox-v3.0.schema.md",
    "schema/comic-book-info-v1.0.schema.md",
    "schema/credit.schema.md",
    "schema/role.schema.md",
    "schema/date.schema.md",
    "schema/identified-object.schema.md",
    "schema/identified-objects.schema.md",
    "schema/identifiers.schema.md",
    "schema/named-identified-object.schema.md",
    "schema/page.schema.md",
    "schema/reprint.schema.md",
    "schema/series.schema.md",
    "schema/alternative-name.schema.md",
    "schema/volume.schema.md"
  ] }
]
docs_dir = "docs"

[project.theme]
variant = "modern"
features = ["content.code.copy", "navigation.footer", "search.highlight"]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.palette]
scheme = "slate"
primary = "indigo"
accent = "orange"

[project.markdown_extensions]
smarty = {}
toc.permalink = true
admonition = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.quotes.callouts = true

[project.plugins.minify]
minify_html = true
minify_inline_js = true
minify_inline_css = true

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.api-autonav]
modules = ["comicbox"]
