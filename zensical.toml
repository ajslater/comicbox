[project]
site_name = "Comicbox"
site_url = "https://comicbox.readthedocs.io/"
site_author = "AJ"
site_description = "Comicbox Comic Metadata Reader & Writer"
nav = ["NEWS.md", "SCHEMAS.md", "TAGS.md"]
docs_dir = "docs"

[project.theme]
variant = "modern"
features = ["content.code.copy", "navigation.footer", "search.highlight"]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.palette]
scheme = "slate"
primary = "deep purple"
accent = "orange"

[project.markdown_extensions]
smarty = {}
toc.permalink = true

[project.plugins.minify]
minify_html = true
minify_inline_js = true
minify_inline_css = true

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.api-autonav]
modules = ["comicbox"]
